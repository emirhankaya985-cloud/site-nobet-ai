name: SiteNobet CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: sitenobet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]' ruff mypy pip-audit
      - run: ruff check app tests
      - run: mypy app --ignore-missing-imports --follow-imports=silent
      - run: pytest -q
      - name: Test PostgreSQL migration
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sitenobet_test
      - name: Production-configured process smoke (API + worker + PostgreSQL)
        run: python tests/production_smoke.py
        env:
          CI: 'true'
          APP_ENV: production
          DATABASE_URL: postgresql://test:test@localhost:5432/sitenobet_test
          SESSION_SECRET: ci-process-smoke-not-a-real-production-secret-2026
          CORS_ORIGINS: https://dashboard.example.invalid
      - name: PostgreSQL integration smoke (ephemeral CI only)
        run: pytest -q tests/test_postgres_integration.py
        env:
          SITENOBET_TEST_POSTGRES: '1'
          DATABASE_URL: postgresql://test:test@localhost:5432/sitenobet_test
      - run: pip-audit
      - name: Check for suspicious tokens
        run: |
          if grep -R -E '(gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,}|[0-9]+:[A-Za-z0-9_-]{35,})' . --exclude-dir=.git --exclude='ci.yml'; then
            echo 'Potential secret present' >&2; exit 1
          fi
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Next.js production runtime HTTP and security-header smoke
        run: |
          set -euo pipefail
          PORT=18764 npm run start > /tmp/sitenobet-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          code="000"
          for attempt in $(seq 1 60); do
            code=$(curl --max-time 2 --silent --output /tmp/sitenobet-home.html --write-out '%{http_code}' http://127.0.0.1:18764/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          if [ "$code" != "200" ]; then
            cat /tmp/sitenobet-next.log
            echo "Next.js server failed readiness with HTTP $code" >&2
            exit 1
          fi
          curl --max-time 5 --silent --show-error --dump-header /tmp/sitenobet-headers.txt --output /dev/null http://127.0.0.1:18764/
          grep -iq '^x-content-type-options: nosniff' /tmp/sitenobet-headers.txt
          grep -iq '^x-frame-options: DENY' /tmp/sitenobet-headers.txt
          grep -iq '^content-security-policy:' /tmp/sitenobet-headers.txt
          echo 'PASS: production Next.js HTTP 200 and security headers'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sitenobet-api ./backend
      - run: docker build -t sitenobet-web ./frontend
