name: SiteNobet Free Scheduled Monitor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/free-monitor.yml']
  schedule:
    # 15-minute nominal cadence, away from the start of each hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitenobet-free-scheduled-worker
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Detect configured Neon secret without revealing its value
        id: check
        env:
          DATABASE_URL: ${{ secrets.SITENOBET_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Configure SITENOBET_DATABASE_URL in Actions Secrets to enable the Free scheduler.'
          fi
  monitor:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      APP_ROLE: worker
      SCHEDULER_MODE: cron
      DATABASE_URL: ${{ secrets.SITENOBET_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.SITENOBET_TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify configured Free-tier secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'SiteNobet database secret missing. Set SITENOBET_DATABASE_URL before enabling.' >&2
            exit 1
          fi
      - name: Install bounded worker
        run: pip install --disable-pip-version-check .
      - name: Apply pending schema migrations
        run: alembic upgrade head
      - name: Run one scheduled monitor batch
        run: python -m app.worker --once --max-checks 20 --max-notifications 50
