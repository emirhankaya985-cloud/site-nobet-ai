[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sitenobet-ai"
version = "0.1.0"
description = "Secure multi-tenant website uptime monitor"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "sqlalchemy==2.0.50",
  "alembic==1.18.4", "pydantic==2.13.5", "httpx==0.28.1",
  "aiohttp==3.14.5", "argon2-cffi==25.1.0", "PyJWT==2.13.0",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Enforce Ruff's conventional correctness-focused baseline; opt into extra
# style rules after the FastAPI-specific `Depends` idiom is configured.
select = ["E4", "E7", "E9", "F"]
