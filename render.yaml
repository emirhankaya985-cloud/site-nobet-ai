# STRICT 0 TL POLICY — Free-tier pilot only. No paid workers or Render Postgres.
# Important: Render Free sleeps after 15 min idle, shares monthly instance-hour quota,
# and is unsuitable for an uptime SLA. The worker runs via GitHub Actions.
services:
  - type: web
    name: sitenobet-api-free
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ROLE
        value: api
      - key: SCHEDULER_MODE
        value: cron
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
  - type: web
    name: sitenobet-web-free
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_CHECK_INTERVAL_SECONDS
        value: '900'
